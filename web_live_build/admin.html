    .rev.hidden { opacity: .72; }
    #drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100vw); background: var(--bg); border-left: 1px solid var(--line-strong); z-index: 60; overflow-y: auto; padding: 24px; transform: translateX(100%); transition: transform .25s; visibility: hidden; }

    .gate { max-width: 460px; margin: 12vh auto 0; border: 1px solid var(--line-strong); padding: 32px; }
    .gate h1 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin: 8px 0 10px; } .gate p { color: var(--text-2); font-size: 14.5px; line-height: 1.55; margin: 0 0 22px; }
    .skel { height: 120px; border: 1px solid var(--line); margin-top: 16px; background: linear-gradient(90deg, transparent, var(--wash), transparent); background-size: 200% 100%; animation: sh 1.4s infinite; } @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 12px 18px; font: 500 12px var(--mono); letter-spacing: .04em; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; max-width: calc(100vw - 32px); }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }
    .keys { font: 400 11px var(--mono); color: var(--muted); margin-top: 40px; }
    @media (prefers-reduced-motion: reduce) { .dot, .skel { animation: none; } #drawer, #toast { transition: none; } }
  </style>

<script>
(() => {
  const SUPABASE_URL = 'https://lbtuikgpgcgrizijfiyl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidHVpa2dwZ2Nncml6aWpmaXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjQxMzgsImV4cCI6MjExMDM0MDEzOH0.y7PrOnBUjIBnT6N2vnOV9qkGgcKX1F_epMqBMoPKejU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const TABS = [['home', 'Home'], ['audience', 'Audience'], ['content', 'Content'], ['community', 'Community'], ['users', 'Users'], ['features', 'Features'], ['streaming', 'Streaming'], ['system', 'System']];
  const TIER = { 1: 'Absolute Cinema', 2: 'Standing Ovation', 3: 'Paisa Vasool', 4: 'Worth a Watch', 5: 'Timepass', 6: 'Left at Interval' };
  const TYPE = { visit: 'Visit', title_open: 'Opened a title', search: 'Search', ott_click: 'Streaming click', trailer_play: 'Trailer played', trailer_fail: 'Trailer failed', poster_fail: 'Poster failed', avail_none: 'Not available', watchlist_add: 'Saved to list', vibe_vote: 'Verdict', mood: 'Mood request', actor_open: 'Actor page', signup: 'Sign-up', login: 'Sign-in', js_error: 'Error', region_change: 'Region change', game_room: 'Game room', game_start: 'Game started', game_conn: 'Game connect', daily_done: 'Daily finished' };
  const BADTYPES = { js_error: 1, trailer_fail: 1, poster_fail: 1, avail_none: 1 };
  const ACTION = { review_delete: 'Deleted a review', review_hide: 'Hid a review', review_restore: 'Restored a review', purge_events: 'Purged old events' };
  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);
  const state = { tab: (location.hash || '#home').slice(1), days: 30, cache: {}, userFilter: '', userSort: 'created', userShow: 'all', revFilter: 'reported', revText: '', armed: null, attn: 0, me: null };
  if (!TABS.some(t => t[0] === state.tab)) state.tab = 'home';

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('en-US');
  const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
  const when = iso => { if (!iso) return 'never'; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const ago = iso => { if (!iso) return 'never'; const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; };
  const bytes = b => { b = Number(b || 0); return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB'; };
  const cname = cc => { try { return cc && cc !== '??' ? new Intl.DisplayNames(['en'], { type: 'region' }).of(cc) : 'Unknown'; } catch (e) { return cc; } };
  const tierName = k => TIER[k] || ('Tier ' + k);
  const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); };

  // ---------------------------------------------------------------- building blocks
  const C = (eyebrow, h, sub, body, cls) => `<section class="card ${cls || ''}"><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(h)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}<div class="body">${body}</div></section>`;
  const head = (h, lede) => `<div class="eyebrow">${esc(TABS.find(t => t[0] === state.tab)[1])}</div><h1 class="page">${esc(h)}</h1>${lede ? `<p class="lede">${esc(lede)}</p>` : ''}`;
  const empty = t => `<div class="empty">${esc(t)}</div>`;
  const note = t => `<div class="note">${t}</div>`;
  const kpi = (label, value, sub, d) => `<div class="kpi"><div class="eyebrow">${esc(label)}</div><div class="v">${esc(value)}</div><div class="s">${d || ''}${d && sub ? ' ' : ''}${esc(sub || '')}</div></div>`;
  function delta(cur, prev, invert) {
    cur = Number(cur) || 0; prev = Number(prev) || 0;
    if (!cur && !prev) return '<span class="d-flat">no change</span>';
    if (!prev) return '<span class="d-up">new</span>';
    const p = Math.round((cur - prev) / prev * 100);
    if (!p) return '<span class="d-flat">same</span>';
    const up = p > 0, good = invert ? !up : up;
    return `<span class="${good ? 'd-up' : 'd-down'}">${up ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
  }
  function bars(list, label, key, o) {
    o = o || {}; list = list || [];
    if (!list.length) return empty('No data yet.');
    const max = Math.max(...list.map(x => Number(x[key]) || 0), 1), tot = list.reduce((a, x) => a + (Number(x[key]) || 0), 0) || 1;
    return list.map(x => { const v = Number(x[key]) || 0; return `<div class="br"><div class="l"><span>${esc(label(x))}</span><span>${num(v)}${o.share ? ' · ' + pct(v, tot) + '%' : ''}</span></div><div class="tr ${o.tone || ''}"><i style="width:${Math.max(2, Math.round(v / max * 100))}%"></i></div></div>`; }).join('');
  }
  function table(cols, rows, emptyMsg) {
    if (!rows || !rows.length) return empty(emptyMsg || 'Nothing here yet.');
    return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.r ? 'r' : ''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.r ? 'r' : ''} ${c.nw ? 'nw' : ''}">${c.html ? c.html(r) : esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function barChart(daily, a, b, labelA, labelB) {
    if (!daily || !daily.length) return empty('No data yet.');
    const W = 760, H = 190, padB = 22, padT = 16, n = daily.length, slot = W / n, bw = Math.max(2, slot - (n > 120 ? 0.5 : 2));
    const max = Math.max(...daily.map(d => (d[a] || 0) + (b ? (d[b] || 0) : 0)), 1);
    const bs = daily.map((d, i) => {
      const va = d[a] || 0, vb = b ? (d[b] || 0) : 0, ha = Math.round(va / max * (H - padB - padT)), hb = Math.round(vb / max * (H - padB - padT)), x = (i * slot).toFixed(1);
      const tip = `<title>${esc(d.d)}: ${va}${b ? ' ' + labelA + ', ' + vb + ' ' + labelB : ' ' + labelA}</title>`;
      return `<g>${tip}<rect x="${x}" y="${H - padB - ha}" width="${bw.toFixed(1)}" height="${Math.max(va ? 2 : 0, ha)}" fill="var(--accent)"/>${b ? `<rect x="${x}" y="${H - padB - ha - hb}" width="${bw.toFixed(1)}" height="${hb}" fill="var(--text-2)" fill-opacity=".45"/>` : ''}</g>`;
    }).join('');
    const mid = daily[Math.floor(n / 2)].d;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(labelA)} per day"><line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line-strong)"/><text x="0" y="${H - 5}">${esc(daily[0].d)}</text><text x="${W / 2}" y="${H - 5}" text-anchor="middle">${esc(mid)}</text><text x="${W}" y="${H - 5}" text-anchor="end">${esc(daily[n - 1].d)}</text><text x="${W}" y="10" text-anchor="end">peak ${max}</text>${bs}</svg>` +
      (b ? `<div class="legend"><span><i style="background:var(--accent)"></i>${esc(labelA)}</span><span><i style="background:var(--text-2);opacity:.5"></i>${esc(labelB)}</span></div>` : '');
  }
  function funnel(f) {
    const steps = [['Visited', f.visit], ['Opened a title', f.title_open], ['Played a trailer', f.trailer], ['Clicked a streaming link', f.ott], ['Signed up or in', f.account]];
    const top = Math.max(f.visit || 0, 1);
    return steps.map(([l, v], i) => `<div class="br"><div class="l"><span>${esc(l)}</span><span>${num(v)}${i ? ' · ' + pct(v, steps[i - 1][1]) + '% of previous' : ''}</span></div><div class="tr good"><i style="width:${Math.max(v ? 2 : 0, Math.round((v || 0) / top * 100))}%"></i></div></div>`).join('');
  }
  function heat(list, key, valKey, cls) {
    const max = Math.max(...list.map(x => x[valKey]), 1);
    return `<div class="heat ${cls || ''}">${list.map(x => `<div style="opacity:${(0.1 + 0.9 * x[valKey] / max).toFixed(2)}" title="${esc(cls ? WD[x[key]] : (x[key] + ':00'))}: ${x[valKey]} visitors"></div>`).join('')}</div>`;
  }
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const tierBars = list => bars((list || []).map(x => ({ k: tierName(x.k), n: x.n })), x => x.k, 'n', { share: true });

  // ---------------------------------------------------------------- data
  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args || {});
    if (error) { const e = new Error(error.message || 'Request failed'); e.code = error.code; throw e; }
    return data;
  }
  const LOADERS = {
    home: () => rpc('admin_home', { p_days: state.days }), growth: () => rpc('admin_growth', { p_days: state.days }), overview: () => rpc('admin_overview', { p_days: state.days }),
    content: () => rpc('admin_content', { p_days: state.days }), features: () => rpc('admin_features', { p_days: state.days }), streaming: () => rpc('admin_streaming', { p_days: state.days }),
    users: () => rpc('admin_users'), system: () => rpc('admin_system'), audit: () => rpc('admin_audit_log', { p_limit: 60 }), reviews: () => rpc('admin_reviews', { p_status: state.revFilter })
  };
  async function load(kind, force) {
    const key = kind + ':' + state.days + ':' + state.revFilter;
    if (!force && state.cache[key]) return state.cache[key];
    return (state.cache[key] = await LOADERS[kind]());
  }

    const items = [
      [a.reported_reviews, 'bad', 'Reviews reported by readers', 'Read them and hide or keep.', 'community'],

      [a.zero_search_7d, 'warn', 'Searches with no answer (7 days)', 'People want titles we cannot find.', 'content'],
      [a.unverified_users, 'warn', 'Accounts that never verified an email', 'Often typos or abandoned sign-ups.', 'users']
    ].filter(x => x[0] > 0);

    const K = [
      ['Visitors', c.visitors, p.visitors, 'unique people'], ['Visits', c.visits, p.visits, 'sessions'], ['Titles opened', c.title_opens, p.title_opens, ''], ['Trailers played', c.trailers, p.trailers, ''],
      ['Saved to lists', c.saves, p.saves, ''], ['Streaming clicks', c.ott, p.ott, 'to services'], ['Searches', c.searches, p.searches, ''], ['New accounts', c.accounts, p.accounts, ''],

      <div class="live">
        <div><div class="eyebrow">Active now</div><div class="v"><span class="dot ${o.live_30m ? '' : 'off'}"></span>${num(o.live_30m)}</div><div class="s mono" style="font-size:12px;color:var(--muted);margin-top:4px">visitors in the last 30 min</div></div>
        <div><div class="eyebrow">Last 24 hours</div><div class="v">${num(o.live_24h)}</div><div class="s mono" style="font-size:12px;color:var(--muted);margin-top:4px">visitors</div></div>
        <div><div class="eyebrow">Last event</div><div class="v" style="font-size:24px;margin-top:10px">${esc(ago(o.newest_event))}</div><div class="s mono" style="font-size:12px;color:var(--muted);margin-top:4px">your own browsing is not counted</div></div>
      </div>
      <div class="grid g21">
        ${C('Needs attention', 'Your inbox', 'Tap a line to go straight to it.', attn)}
        ${C('Audience', 'Visitors per day', 'New and returning, last ' + d + ' days.', barChart((g.daily || []).map(x => ({ d: x.d, new: x.new, ret: Math.max(0, x.visitors - x.new) })), 'new', 'ret', 'new', 'returning'))}
      </div>
      <div class="kpis">${K.map(k => kpi(k[0], num(k[1]), (k[3] ? k[3] + ' · ' : '') + 'vs previous ' + d + ' d', delta(k[1], k[2], k[4]))).join('')}</div>
      <div class="grid g2">
        ${C('Live', 'Activity feed', 'The latest actions on the site, newest first. Refreshes by itself every minute.', o.feed.length ? `<ul class="feed">${o.feed.map(f => `<li><span class="t">${esc(ago(f.ts))}</span><span><span class="chip ${BADTYPES[f.type] ? 'bad' : ''}">${esc(TYPE[f.type] || f.type)}</span></span><span class="w">${esc(f.what)}</span><span class="c">${esc(f.cc)} · ${esc(f.device || '')}</span></li>`).join('')}</ul>` : empty('No activity yet.'))}
        ${C('Funnel', 'Daily rhythm', 'Visitors by hour of the day, India time. Brighter is busier.', heat(g.by_hour, 'h', 'n') + '<div class="hl"><span>12 am</span><span>6 am</span><span>12 pm</span><span>6 pm</span><span>11 pm</span></div><div style="margin-top:22px"></div>' + heat(g.by_weekday, 'w', 'n', 'w') + '<div class="hl">' + WD.map(x => `<span>${x}</span>`).join('') + '</div>')}
      </div>`;
  }

      <div class="kpis">${kpi('Streaming clicks', num(s.total), 'in this period')}${kpi('Services', num((s.by_service || []).length))}${kpi('Countries', num((s.by_region || []).length))}${kpi('No-option views', num((s.unavailable_by_region || []).reduce((a, x) => a + x.n, 0)))}</div>
      <div class="grid g2">
        ${C('Services', 'Clicks by service', '', bars(s.by_service, x => x.k, 'n', { share: true }))}
        ${C('Regions', 'Clicks by country', '', bars(s.by_region, x => cname(x.k), 'n', { share: true }))}
        ${C('Detail', 'Service by country', '', table([{ h: 'Service', v: r => r.svc }, { h: 'Country', v: r => cname(r.cc) }, { h: 'Clicks', r: 1, v: r => num(r.n) }], s.matrix))}
        ${C('Titles', 'Where people go to watch', '', table([{ h: 'Title', html: r => esc(r.t || r.id) }, { h: 'Clicks', r: 1, v: r => num(r.n) }], s.top_titles))}
      </div>
      <div class="grid">${C('Gaps', 'Countries with the most “not available” views', 'Where the catalogue shows nothing to watch.', bars(s.unavailable_by_region, x => cname(x.k), 'n', { tone: 'warn' }))}</div>`;
  }

  async function health() {
    const checks = [['Home page', '/'], ['App file', '/sw.js'], ['Extra catalogue', '/catalog_extra.json', 'HEAD'], ['Featured today', '/api/featured?cc=IN'], ['Upcoming', '/api/upcoming?cc=IN'], ['Missing page returns 404', '/__no_such_page__', 'GET', 404]];
    const out = await Promise.all(checks.map(async ([name, url, method, want]) => {
      const t0 = performance.now();
      try { const r = await fetch(url, { method: method || 'GET', cache: 'no-store' }); return { name, ok: r.status === (want || 200), code: r.status, ms: Math.round(performance.now() - t0) }; }
      catch (e) { return { name, ok: false, code: 'failed', ms: Math.round(performance.now() - t0) }; }
    }));
    const t0 = performance.now(); let dbOk = true; try { await rpc('is_admin'); } catch (e) { dbOk = false; }
    out.push({ name: 'Database', ok: dbOk, code: dbOk ? 200 : 'failed', ms: Math.round(performance.now() - t0) });
    return out;
  }

  async function viewSystem(force) {
    const [s, au] = await Promise.all([load('system', force), load('audit', force)]);
    let version = 'unknown';
    try { const t = await (await fetch('/sw.js', { cache: 'no-store' })).text(); const m = /watchvibe-cache-(v\d+)/.exec(t); if (m) version = m[1]; } catch (e) {}
    const age = s.newest_event ? (Date.now() - new Date(s.newest_event).getTime()) / 3600000 : null;
    return head('Health, housekeeping and audit', 'Is everything up, how full is the database, and what has been changed from this page.') + `
      <div class="kpis">${kpi('App version', version, 'service worker cache')}${kpi('Events, 24 h', num(s.events_24h), age !== null && age < 24 ? 'tracking is live' : 'no recent events')}${kpi('Errors, 24 h', num(s.errors_24h))}${kpi('Database', bytes(s.database_bytes), 'of 500 MB free plan')}</div>
      <div class="grid g2">
        ${C('Checks', 'Is it all working?', 'Live checks from this browser.', '<div id="healthBox">' + empty('Running checks…') + '</div><div class="tools"><button type="button" class="btn sm" id="rehealth">Run again</button></div>')}
        ${C('Storage', 'Housekeeping', 'The events table holds ' + bytes(s.events_table_bytes) + ' (' + num(s.events_total) + ' events since ' + (s.oldest_event ? when(s.oldest_event) : 'start') + '). Delete old analytics to save space.',
          `<div class="tools" style="margin-top:0"><select id="purgeDays" class="btn"><option value="90">Older than 90 days</option><option value="180">Older than 180 days</option><option value="365">Older than 1 year</option></select><button id="purge" type="button" class="btn danger">Delete old events</button></div><p id="purgeMsg" class="sub" role="status"></p>`)}
        ${C('Access', 'Admins', 'The admin list lives in the database (table admins). Only a verified email on that list gets in.', (s.admins || []).map(e => `<div style="padding:6px 0;font-size:14px">${esc(e)}</div>`).join(''))}
        ${C('Errors', 'Recent site errors', 'JavaScript errors visitors hit.', table([{ h: 'When', v: r => ago(r.ts), nw: 1 }, { h: 'Message', v: r => r.m }, { h: 'Where', v: r => r.w }, { h: 'Country', v: r => cname(r.cc) }], s.recent_errors, 'No errors reported.'))}
      </div>
      <div class="grid">${C('Audit log', 'What was changed from this page', 'Hides, restores, deletions and purges. Kept in the database; it cannot be edited from here.', table([{ h: 'When', v: r => when(r.ts), nw: 1 }, { h: 'Who', v: r => r.admin_email }, { h: 'Action', html: r => `<span class="chip">${esc(ACTION[r.action] || r.action)}</span>` }, { h: 'Detail', v: r => (r.detail || r.target || '') }], au, 'Nothing has been changed yet.'))}</div>
      <div class="grid">${C('Privacy', 'What is stored about visitors', '', '<p style="margin:0;font-size:14px;line-height:1.6;color:var(--text-2)">Analytics store no emails, names or IP addresses: only a random anonymous visitor id, country, device type, browser and what was clicked. Visitors with Do Not Track or Global Privacy Control are not tracked, and neither is the admin.</p>')}</div>`;
  }

  const VIEWS = { home: viewHome, audience: viewAudience, content: viewContent, community: viewCommunity, users: viewUsers, features: viewFeatures, streaming: viewStreaming, system: viewSystem };

  // ---------------------------------------------------------------- shell
  function drawTabs() {
    $('tabs').innerHTML = TABS.map(([id, label]) => `<button type="button" class="tab" data-tab="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${esc(label)}${id === 'home' && state.attn ? `<i>${state.attn}</i>` : ''}</button>`).join('');
  }
  function gate(title, body, action) {
    app.innerHTML = `<div class="gate"><div class="eyebrow">Admin Studio</div><h1>${esc(title)}</h1><p>${body}</p>${action || ''}</div>`;
  }
  let renderToken = 0;
  async function render(force, quiet) {
    const my = ++renderToken;
    drawTabs();
    if (!quiet) app.innerHTML = '<div class="skel"></div><div class="skel" style="height:260px"></div><div class="skel"></div>';
    try {
      const html = await VIEWS[state.tab](force);
      if (my !== renderToken) return;
      const y = quiet ? window.scrollY : 0;
      app.innerHTML = html; drawTabs(); if (quiet) window.scrollTo(0, y);
      bindView();
    } catch (e) {
      if (my !== renderToken) return;
      if (e.code === '42501' || /not authorized/i.test(e.message)) gate('Admin access only', 'This account is not on the admin list.', '<a href="/" class="btn primary">Back to WatchVibe</a>');
      else if (e.code === 'PGRST202' || /Could not find the function/i.test(e.message)) gate('Database not set up', 'A report function is missing in Supabase. Run <b>supabase/admin_studio_v2.sql</b> in the SQL editor, then refresh.');
      else gate('Could not load', esc(e.message || 'Unknown error') + '<br><br><button id="retry" type="button" class="btn primary">Try again</button>');
      const r = $('retry'); if (r) r.onclick = () => render(true);
    }
  }
  function go(tab) { state.tab = tab; state.armed = null; history.replaceState(null, '', '#' + tab); window.scrollTo(0, 0); render(false); }

  function bindView() {
    const uf = $('userFilter');
    if (uf) uf.oninput = () => { state.userFilter = uf.value; clearTimeout(window.__t); window.__t = setTimeout(async () => { const pos = uf.selectionStart; await render(false, true); const n = $('userFilter'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); };
    const rt = $('revText');
    if (rt) rt.oninput = () => { state.revText = rt.value; clearTimeout(window.__t); window.__t = setTimeout(async () => { const pos = rt.selectionStart; await render(false, true); const n = $('revText'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); };
    [['userSort', 'userSort'], ['userShow', 'userShow']].forEach(([id, k]) => { const el = $(id); if (el) el.onchange = () => { state[k] = el.value; render(false, true); }; });
    const rf = $('revFilter'); if (rf) rf.onchange = () => { state.revFilter = rf.value; state.armed = null; render(false); };
    const csv = $('csv');
    if (csv) csv.onclick = () => {
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"';
      const head = ['name', 'email', 'method', 'joined', 'last_sign_in', 'verified', 'watchlist', 'watched'];
      const lines = [head.join(',')].concat((window.__rows || []).map(r => [r.name, r.email, r.provider, r.created_at, r.last_sign_in_at, r.verified, r.watchlist, r.watched].map(q).join(',')));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'watchvibe_users_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); URL.revokeObjectURL(a.href);
    };
    const purge = $('purge');
    if (purge) purge.onclick = async () => {
      const days = Number($('purgeDays').value), msg = $('purgeMsg');
      if (!confirm('Permanently delete analytics events older than ' + days + ' days? This cannot be undone.')) return;
      msg.textContent = 'Deleting…';
      try { const n = await rpc('admin_purge_events', { p_days: days }); msg.textContent = 'Deleted ' + num(n) + ' events.'; state.cache = {}; } catch (e) { msg.textContent = 'Could not delete: ' + e.message; }
    };
    const hb = $('healthBox');
    if (hb) { const run = async () => { hb.innerHTML = empty('Running checks…'); const r = await health(); if ($('healthBox') !== hb) return; hb.innerHTML = table([{ h: 'Check', v: x => x.name }, { h: 'Status', html: x => `<span class="chip ${x.ok ? 'good' : 'bad'}">${x.ok ? 'OK' : 'Problem'}</span> <span class="mono" style="font-size:11px;color:var(--muted)">${esc(x.code)}</span>` }, { h: 'Time', r: 1, v: x => x.ms + ' ms' }], r); }; run(); const b = $('rehealth'); if (b) b.onclick = run; }
  }

  // ---------------------------------------------------------------- one delegated handler (no text from the database ever goes into an onclick string)
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-tab],[data-go],[data-act],[data-user]'); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.user) return openUser(t.dataset.user);
    const id = t.dataset.id, act = t.dataset.act;
    try {
      if (act === 'del') { if (state.armed !== id) { state.armed = id; t.textContent = 'Click again to delete'; return; } await rpc('admin_review_delete', { p_id: id }); toast('Review deleted.'); }
      else { await rpc('admin_review_status', { p_id: id, p_status: act === 'hide' ? 'hidden' : 'visible' }); toast(act === 'hide' ? 'Review hidden.' : 'Review restored.'); }
      state.armed = null; state.cache = {}; render(true, true);
    } catch (err) { toast('Could not update: ' + err.message); }
  });
  async function openUser(id) {
    const dr = $('drawer'); dr.innerHTML = '<div class="eyebrow">Loading…</div>'; dr.classList.add('open'); dr.setAttribute('aria-hidden', 'false'); $('scrim').classList.add('open');
    try {
      const u = await rpc('admin_user_detail', { p_id: id });
      dr.innerHTML = `<button type="button" class="btn sm" id="closeDrawer">Close (Esc)</button><div class="eyebrow" style="margin-top:22px">Account</div><h3>${esc(u.name || u.email || 'Unnamed')}</h3><div class="mono" style="font-size:12px;color:var(--muted);overflow-wrap:anywhere">${esc(u.email || '')}</div>
        <dl class="kv"><div><dt>Joined</dt><dd>${esc(when(u.created_at))}</dd></div><div><dt>Last sign-in</dt><dd>${esc(ago(u.last_sign_in_at))}</dd></div><div><dt>Method</dt><dd>${esc(u.provider)}</dd></div><div><dt>Email verified</dt><dd>${u.verified ? 'Yes' : 'No'}</dd></div>
        <div><dt>Verdicts given</dt><dd>${num(u.verdicts)}</dd></div><div><dt>Reviews written</dt><dd>${num(u.reviews)}</dd></div><div><dt>Reports on their reviews</dt><dd>${num(u.reports_on_their_reviews)}</dd></div><div><dt>Reports they made</dt><dd>${num(u.reports_made)}</dd></div>
        <div><dt>Daily Challenge plays</dt><dd>${num(u.daily_plays)}${u.daily_best != null ? ' · best ' + num(u.daily_best) : ''}</dd></div></dl>
        <div class="eyebrow" style="margin-top:26px">Latest reviews</div>${(u.recent_reviews || []).length ? u.recent_reviews.map(r => `<div class="rev ${r.status === 'hidden' ? 'hidden' : ''}" style="margin-top:8px"><div class="meta"><b style="color:var(--text);font-family:var(--sans)">${esc(r.title_name)}</b><span>${esc(when(r.created_at))}</span>${r.status === 'hidden' ? '<span class="chip warn">Hidden</span>' : ''}</div><p class="hd" style="font-size:15px">${esc(r.headline)}</p></div>`).join('') : empty('No reviews written.')}`;
      $('closeDrawer').onclick = closeDrawer;
    } catch (err) { dr.innerHTML = `<button type="button" class="btn sm" id="closeDrawer">Close</button><p>${esc(err.message)}</p>`; $('closeDrawer').onclick = closeDrawer; }
  }
  function closeDrawer() { $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('open'); }
  $('scrim').addEventListener('click', closeDrawer);
  $('range').addEventListener('change', e => { state.days = Number(e.target.value); render(false); });
  $('refresh').addEventListener('click', () => { state.cache = {}; render(true); });
  $('theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; try { localStorage.setItem('wv_theme', t); } catch (e) {} });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDrawer();
    if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName)) return;
    if (e.key >= '1' && e.key <= String(TABS.length)) go(TABS[Number(e.key) - 1][0]);
    else if (e.key === 'r' || e.key === 'R') { state.cache = {}; render(true); }
    else if (e.key === '/' && $('userFilter')) { e.preventDefault(); $('userFilter').focus(); }
  });
  // the home screen keeps itself fresh while it is open and visible
  setInterval(() => { if (state.tab === 'home' && !document.hidden && state.me) { delete state.cache['home:' + state.days + ':' + state.revFilter]; render(false, true); } }, 60000);

  (async function start() {
    drawTabs();
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) { gate('Sign in first', 'Sign in on WatchVibe with the admin account, then come back to this page.', '<a href="/" class="btn primary">Go to WatchVibe</a>'); return; }
    let ok = false; try { ok = await rpc('is_admin'); } catch (e) {}
    if (!ok) { gate('Admin access only', 'This account is not on the admin list.', '<a href="/" class="btn primary">Back to WatchVibe</a>'); return; }
    state.me = true;
    $('range').value = String(state.days);
    render(false);
  })();
})();
</script>
</body>
</html>
