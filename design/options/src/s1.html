<title>WatchVibe · Index Plus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var q=(location.search.match(/theme=(light|dark)/)||[])[1];var t=q||localStorage.getItem('wvd_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/*FONTS*/
/*BASE*/
/*PAGES*/
.hero{border-bottom:1px solid var(--ink)}.hero .grid{padding-top:40px;padding-bottom:40px}
.hero .meta{grid-column:1/4;display:flex;flex-direction:column;justify-content:space-between;color:var(--mute);padding-bottom:6px}.hero .meta b{color:var(--ink);font-weight:500}
.hero .main{grid-column:4/13}.hero h1{font:600 clamp(60px,10.5vw,170px)/.84 var(--fb);letter-spacing:-.07em;margin-bottom:34px}
.hero .pic{height:420px;background:var(--line) center/cover;grid-column:4/13;margin-bottom:18px}
.hero .row2{grid-column:4/13;display:flex;gap:22px;justify-content:space-between;align-items:flex-start}.hero p{max-width:540px;font-size:17px}
.stats .grid{padding-top:26px;padding-bottom:26px}.stats{border-bottom:1px solid var(--ink)}.stats .c{grid-column:span 3;border-left:1px solid var(--line);padding-left:18px}.stats .c:first-child{border-left:0;padding-left:0}.stats b{display:block;font:600 56px/1 var(--fb);letter-spacing:-.06em}.stats span{color:var(--mute)}
.sec{border-bottom:1px solid var(--ink)}.sec .grid{padding-top:30px;padding-bottom:44px}.sec .hd{grid-column:1/4;position:sticky;top:80px;align-self:start}.sec .hd h2{font:600 26px/1.05 var(--fb);letter-spacing:-.04em;margin:6px 0 10px}.sec .hd p{color:var(--mute);font-size:14px;max-width:210px}.sec .bd{grid-column:4/13;min-width:0}
.mlist a{display:grid;grid-template-columns:50px 1fr 1.4fr 30px;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line);transition:.2s}.mlist a:last-child{border-bottom:1px solid var(--line)}.mlist a:hover{padding-left:14px;background:var(--hov);color:var(--accent)}.mlist b{font:600 24px var(--fb);letter-spacing:-.04em}.mlist span{color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:16px;position:relative}.tabs button{height:36px;padding:0 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 12px var(--fm);text-transform:uppercase;cursor:pointer;transition:.2s}.tabs button.on{background:var(--ink);color:var(--bg)}
.dc{background:var(--accent);color:var(--accent-ink)}.dc .grid{padding-top:56px;padding-bottom:56px}.dc h3{grid-column:1/9;font:600 clamp(40px,6vw,92px)/.92 var(--fb);letter-spacing:-.06em}.dc .r{grid-column:9/13;align-self:end;justify-self:end;text-align:right}.dc .big{font:600 120px/1 var(--fb);letter-spacing:-.07em}.dc .btn{background:var(--accent-ink);color:var(--accent);margin-top:26px;border-color:var(--accent-ink)}.dc .btn:hover{background:var(--bg);color:var(--ink)}
@media(max-width:900px){.hero .meta{grid-column:1/13;flex-direction:row;gap:20px;margin-bottom:18px}.hero .main,.hero .pic,.hero .row2{grid-column:1/13}.hero .pic{height:260px}.hero .row2{flex-direction:column}.stats .c{grid-column:span 6;margin-bottom:14px;border-left:0;padding-left:0}.stats b{font-size:40px}.sec .hd{grid-column:1/13;position:static;margin-bottom:20px}.sec .bd{grid-column:1/13}.mlist a{grid-template-columns:32px 1fr 24px}.mlist .d{display:none}.dc h3,.dc .r{grid-column:1/13}.dc .r{justify-self:start;text-align:left;margin-top:28px}.dc .big{font-size:84px}}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← All variations</a>
<script src="data.js"></script><script src="app.js"></script><script src="swiss-ui.js"></script>
<script>
const {films,moods,top10,indian,acclaimed,hero,esc}=WV;
const lists={week:top10,month:acclaimed.slice(0,10),all:films.slice().sort((a,b)=>b.rating-a.rating).slice(0,10)};
const mq=moods.map(m=>`<span>${esc(m.label)}</span>`).join('')+['Daily challenge no. 21','New: Project Hail Mary','Streaming now','Hidden gems'].map(t=>`<span>${t}</span>`).join('');
const avg=(films.reduce((s,f)=>s+f.rating,0)/films.length).toFixed(1);
const home=()=>`<div class="marq mo"><div>${mq}${mq}</div></div>
<div class="hero"><div class="grid"><div class="meta mo"><div>Featured<br><b>${esc(hero.genre.toUpperCase())} · ${hero.year}</b></div><div>No. 01 / 40</div></div><div class="main"><h1>Project<br>Hail Mary</h1></div><div class="pic" style="background-image:url(${hero.back()})"></div><div class="row2"><p>${esc(hero.plot)}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn solid" data-trailer="${hero.id}">▶ Play trailer</button><button type="button" class="btn" data-add="${hero.id}">+ Watchlist</button></div></div></div></div>
<div class="stats"><div class="grid"><div class="c"><b data-count="${films.length}">0</b><span class="mo">Films</span></div><div class="c"><b data-count="${moods.length}">0</b><span class="mo">Moods</span></div><div class="c"><b data-count="${avg}" data-dec="1">0</b><span class="mo">Average rating</span></div><div class="c"><b data-count="7">0</b><span class="mo">Day streak</span></div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--accent)">01 — Moods</span><h2>Start with a feeling.</h2><p>Hover a mood to see its best film.</p></div><div class="bd mlist">${moods.map((m,i)=>{const top=films.filter(f=>f.moods.includes(m.id)).sort((a,b)=>b.rating-a.rating)[0];return `<a href="#mood-${m.id}" data-prev="${top.poster()}"><span class="mo">0${i+1}</span><b>${esc(m.label)}</b><span class="d">${esc(m.blurb)}</span><span class="mo">→</span></a>`}).join('')}</div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--accent)">02 — Chart</span><h2>Top ten.</h2><p>Use the tabs, or press J and K to move down the list.</p></div><div class="bd"><div class="tabs"><button type="button" class="on" data-tab="week">This week</button><button type="button" data-tab="month">This month</button><button type="button" data-tab="all">All time</button></div><div id="chart">${SW.indexRows(lists.week)}</div></div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--accent)">03 — Regional</span><h2>Indian cinema.</h2><p>Hindi, Tamil, Malayalam, Telugu, Kannada.</p></div><div class="bd">${SW.stripOf(indian)}</div></div></div>
<div class="sec wide"><div class="grid"><div class="hd"><span class="mo" style="color:var(--accent)">04 — Canon</span><h2>Critically acclaimed.</h2><p>Rated 8 and above by thousands of people.</p></div><div class="bd">${SW.stripOf(acclaimed,{wide:true})}</div></div></div>
<div class="dc"><div class="grid"><h3>Guess the film.<br>Every day.</h3><div class="r"><div class="mo">Your streak</div><div class="big">7</div><a class="btn" href="#games">Play today's round →</a></div></div></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('chart').innerHTML=SW.indexRows(lists[b.dataset.tab]);});
WVApp.mount({name:'WatchVibe · Index Plus',shell:(i,r)=>SW.shell(i,r),home,card:SW.card});
</script>
