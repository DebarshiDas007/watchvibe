<title>WatchVibe · Swiss Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*FONTS*/
:root{--bg:#f4f4f0;--surface:#fff;--ink:#0d0d0d;--mute:#6f6f69;--line:#d4d4cd;--accent:#1d3dff;--accent-ink:#fff;--r:0;--rc:0;--rb:0;--fd:Switzer,system-ui,sans-serif;--fb:Switzer,system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;--pad:40px;--hw:600;--hls:-.06em;--blue:#1d3dff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
/*PAGES*/
a{color:inherit;text-decoration:none}.mo{font-family:var(--fm);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.back-all{position:fixed;left:12px;bottom:12px;z-index:400;font:500 11px var(--fm);background:var(--ink);color:#fff;padding:8px 14px;letter-spacing:.06em;text-transform:uppercase}
.chipb{border-color:var(--ink);color:var(--ink);font-family:var(--fm);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.chipb.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tagb{font-family:var(--fm);font-size:11px;text-transform:uppercase;background:transparent}.btn{font-weight:500}.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}.btn.solid:hover{background:var(--blue);border-color:var(--blue)}.btn[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.fp-hero .pg-back,.fp-hero h1,.fp-hero .fp-info p,.fp-hero .fp-meta span{color:#fff}.fp-sh{background:linear-gradient(0deg,rgba(13,13,13,.9),rgba(13,13,13,.1) 70%)}.fp-hero .btn{border-color:#fff;color:#fff}.fp-hero .btn.solid{background:#fff;color:var(--ink);border-color:#fff}.fp-hero .tagb{color:#fff;border-color:#fff}.fp-hero .btn[aria-pressed=true]{background:var(--blue);color:#fff}
.gm-o.ok{background:var(--blue);border-color:var(--blue);color:#fff}.gm-o.ok small{color:#fff}.gm-bar i{background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:0 var(--pad)}
header{border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--bg);z-index:60}header .grid{height:58px;align-items:center}
.logo{grid-column:1/4;font:700 20px var(--fb);letter-spacing:-.04em}.logo i{font-style:normal;color:var(--blue)}
nav.m{grid-column:4/10;display:flex;gap:26px}nav.m a{color:var(--mute)}nav.m a.on,nav.m a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.rt2{grid-column:10/13;justify-self:end;display:flex;gap:24px;color:var(--mute);align-items:center}.rt2 button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-transform:inherit;letter-spacing:inherit}.rt2 a:hover,.rt2 button:hover{color:var(--ink)}
.hero{border-bottom:1px solid var(--ink)}.hero .grid{padding-top:40px;padding-bottom:40px}
.hero .meta{grid-column:1/4;display:flex;flex-direction:column;justify-content:space-between;color:var(--mute);padding-bottom:6px}.hero .meta b{color:var(--ink);font-weight:500}
.hero .main{grid-column:4/13}.hero h1{font:600 clamp(60px,10.5vw,170px)/.84 var(--fb);letter-spacing:-.07em;margin-bottom:34px}
.hero .pic{height:420px;background:#ddd center/cover;grid-column:4/13;margin-bottom:18px}
.hero .row2{grid-column:4/13;display:flex;gap:22px;justify-content:space-between;align-items:flex-start}.hero p{max-width:540px;font-size:17px;color:#2b2b28}
.sec{border-bottom:1px solid var(--ink)}.sec .grid{padding-top:30px;padding-bottom:44px}.sec .hd{grid-column:1/4;position:sticky;top:80px;align-self:start}.sec .hd h2{font:600 26px/1.05 var(--fb);letter-spacing:-.04em;margin:6px 0 10px}.sec .hd p{color:var(--mute);font-size:14px;max-width:210px}
.sec .bd{grid-column:4/13;min-width:0}
.mlist a{display:grid;grid-template-columns:50px 1fr 1.4fr 30px;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line);transition:.2s}.mlist a:last-child{border-bottom:1px solid var(--line)}.mlist a:hover{padding-left:14px;background:var(--surface);color:var(--blue)}.mlist b{font:600 24px var(--fb);letter-spacing:-.04em}.mlist span{color:var(--mute)}.mlist a:hover span{color:var(--ink)}
.strip{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.card{display:block;flex:0 0 auto;width:178px}.card .ph{aspect-ratio:2/3;background:#ddd center/cover;transition:.3s}.card:hover .ph{filter:brightness(.85);outline:2px solid var(--blue);outline-offset:3px}.card .t{font-weight:600;font-size:15px;letter-spacing:-.02em;margin-top:10px;line-height:1.2}.card .s{color:var(--mute);margin-top:4px;font:11.5px var(--fm)}
.wide .card{width:340px}.wide .ph{aspect-ratio:16/9}
.index a{display:grid;grid-template-columns:44px 56px 1fr 130px 80px;align-items:center;gap:18px;padding:12px 0;border-top:1px solid var(--line);transition:.2s}.index a:last-child{border-bottom:1px solid var(--line)}.index a:hover{background:var(--surface);padding-left:12px}
.index .n{font:500 12px var(--fm);color:var(--mute)}.index .im{width:56px;aspect-ratio:2/3;background:#ddd center/cover}.index b{font:600 22px var(--fb);letter-spacing:-.04em}.index .g,.index .r{font:400 12px var(--fm);text-transform:uppercase}.index .r{text-align:right;color:var(--blue)}
.dc{background:var(--blue);color:#fff}.dc .grid{padding-top:56px;padding-bottom:56px}.dc h3{grid-column:1/9;font:600 clamp(40px,6vw,92px)/.92 var(--fb);letter-spacing:-.06em}.dc .r{grid-column:9/13;align-self:end;justify-self:end;text-align:right}.dc .big{font:600 120px/1 var(--fb);letter-spacing:-.07em}.dc .btn{background:#fff;color:var(--blue);margin-top:26px;border-color:#fff}.dc .btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
footer .grid{padding-top:30px;padding-bottom:40px;color:var(--mute)}footer .a{grid-column:1/7}footer .b{grid-column:7/13;text-align:right}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg);border-top:1px solid var(--ink);justify-content:space-around;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font:500 11px var(--fm);text-transform:uppercase}.mnav a.on{color:var(--blue)}
@media(max-width:900px){:root{--pad:18px}.grid{gap:0 12px}.logo{grid-column:1/8}nav.m{display:none}.rt2{grid-column:8/13}.rt2 .hide-m{display:none}.hero .meta{grid-column:1/13;flex-direction:row;gap:20px;margin-bottom:18px}.hero .main,.hero .pic,.hero .row2{grid-column:1/13}.hero .pic{height:260px}.hero .row2{flex-direction:column}.sec .hd{grid-column:1/13;position:static;margin-bottom:20px}.sec .bd{grid-column:1/13}.mlist a{grid-template-columns:32px 1fr 24px}.mlist .d{display:none}.index a{grid-template-columns:30px 44px 1fr 56px}.index .g{display:none}.card{width:140px}.wide .card{width:260px}.dc h3,.dc .r{grid-column:1/13}.dc .r{justify-self:start;text-align:left;margin-top:28px}.dc .big{font-size:84px}footer .a,footer .b{grid-column:1/13;text-align:left}.mnav{display:flex}body{padding-bottom:60px}}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← All designs</a>
<script src="data.js"></script><script src="app.js"></script>
<script>
const {films,moods,top10,indian,acclaimed,hero,esc}=WV;
const card=(f,o={})=>`<a class="card" href="#film-${f.id}"><div class="ph" style="background-image:url(${o.wide?f.back():f.poster()})"></div><div class="t">${esc(f.title)}</div><div class="s">★ ${f.rating} · ${f.year}</div></a>`;
const shell=(inner,r)=>`<header><div class="grid"><a class="logo" href="#home">Watch<i>Vibe</i></a><nav class="m mo"><a class="${r==='home'?'on':''}" href="#home">Index</a><a class="${r==='films'?'on':''}" href="#films">Films</a><a class="${r==='games'?'on':''}" href="#games">Games</a><a class="${r==='watchlist'?'on':''}" href="#watchlist">Watchlist${WVApp.wlCount()?' ('+WVApp.wlCount()+')':''}</a></nav><div class="rt2 mo"><button type="button" data-search>Search /</button><a class="hide-m" href="#watchlist">Saved</a></div></div></header>${inner}<footer><div class="grid mo"><div class="a">WatchVibe — find what to watch by feeling</div><div class="b">Privacy · Terms · Film data from TMDB</div></div></footer><nav class="mnav"><a class="${r==='home'?'on':''}" href="#home">Index</a><a class="${r==='films'?'on':''}" href="#films">Films</a><a class="${r==='games'?'on':''}" href="#games">Games</a><a class="${r==='watchlist'?'on':''}" href="#watchlist">Saved</a></nav>`;
const home=()=>`<div class="hero"><div class="grid"><div class="meta mo"><div>Featured<br><b>${esc(hero.genre.toUpperCase())} · ${hero.year}</b></div><div>No. 01 / 40</div></div><div class="main"><h1>Project<br>Hail Mary</h1></div><div class="pic" style="background-image:url(${hero.back()})"></div><div class="row2"><p>${esc(hero.plot)}</p><div style="display:flex;gap:10px"><button type="button" class="btn solid" data-trailer="${hero.id}">▶ Play trailer</button><button type="button" class="btn" data-add="${hero.id}">+ Watchlist</button></div></div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--blue)">01 — Moods</span><h2>Start with a feeling.</h2><p>Six moods, each one a whole page of films.</p></div><div class="bd mlist">${moods.map((m,i)=>`<a href="#mood-${m.id}"><span class="mo">0${i+1}</span><b>${esc(m.label)}</b><span class="d">${esc(m.blurb)}</span><span class="mo">→</span></a>`).join('')}</div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--blue)">02 — Chart</span><h2>Top ten right now.</h2><p>Newer films with the biggest ratings and crowds.</p></div><div class="bd index">${top10.map((f,i)=>`<a href="#film-${f.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><div class="im" style="background-image:url(${f.poster()})"></div><b>${esc(f.title)}</b><span class="g">${esc(f.genre.split(' · ')[0])} · ${f.year}</span><span class="r">★ ${f.rating}</span></a>`).join('')}</div></div></div>
<div class="sec"><div class="grid"><div class="hd"><span class="mo" style="color:var(--blue)">03 — Regional</span><h2>Indian cinema.</h2><p>Hindi, Tamil, Malayalam, Telugu, Kannada.</p></div><div class="bd"><div class="strip">${indian.map(f=>card(f)).join('')}</div></div></div></div>
<div class="sec wide"><div class="grid"><div class="hd"><span class="mo" style="color:var(--blue)">04 — Canon</span><h2>Critically acclaimed.</h2><p>Rated 8 and above by thousands of people.</p></div><div class="bd"><div class="strip">${acclaimed.map(f=>card(f,{wide:true})).join('')}</div></div></div></div>
<div class="dc"><div class="grid"><h3>Guess the film.<br>Every day.</h3><div class="r"><div class="mo">Your streak</div><div class="big">7</div><a class="btn" href="#games">Play today's round →</a></div></div></div>`;
WVApp.mount({name:'WatchVibe · Swiss Index',shell,home,card});
</script>
