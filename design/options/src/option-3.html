<title>WatchVibe · Paper Pop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
/*FONTS*/
:root{--bg:#fff3dc;--surface:#fffaf0;--ink:#141414;--mute:#5f594b;--line:#141414;--accent:#ff6b2c;--accent-ink:#141414;--r:18px;--rc:99px;--rb:14px;--fd:'Cabinet Grotesk',sans-serif;--fb:Satoshi,system-ui,sans-serif;--fm:'Space Mono',monospace;--pad:36px;--hw:800;--hls:-.03em;--lime:#b8f24a;--sky:#72c9ff;--pink:#ff9ec7;--yel:#ffd84a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--fb);background-image:radial-gradient(rgba(20,20,20,.09) 1.2px,transparent 1.2px);background-size:22px 22px}
/*PAGES*/
a{color:inherit;text-decoration:none}.bx{border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:18px;background:var(--surface);transition:.15s}
.back-all{position:fixed;left:12px;bottom:12px;z-index:400;font:700 12px var(--fm);background:var(--yel);color:var(--ink);border:2.5px solid var(--ink);padding:7px 14px;border-radius:99px;box-shadow:3px 3px 0 var(--ink)}
.chipb,.tagb,.pg-sort select,.gm-o,.gm-card,.pg-empty,.wl-x,.wv-x,.wv-x2{border:2.5px solid var(--ink)}.chipb{color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:700}.chipb:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}.chipb.on{background:var(--lime);color:var(--ink)}
.btn{border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:800 16px var(--fd);color:var(--ink);background:#fff;border-radius:14px}.btn.solid{background:var(--accent)}.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.btn[aria-pressed=true]{background:var(--lime);color:var(--ink)}
.gm-card,.gm-o{box-shadow:5px 5px 0 var(--ink)}.gm-o.dim{opacity:.5}.gm-bar{border:2px solid var(--ink);background:#fff}.gm-bar i{background:var(--accent)}.gm-pic{border:2.5px solid var(--ink)}
.fp-poster{border:2.5px solid var(--ink)}.fp-sh{background:linear-gradient(0deg,rgba(20,20,20,.92),transparent 70%)}.fp-info,.fp-info h1,.fp-info p,.fp-meta,.fp-hero .pg-back{color:#fff!important}.fp-meta span{color:#ece7da}.fp-hero .tagb{background:var(--yel);color:var(--ink)}.fp-hero .btn[aria-pressed=false]{background:#fff}
header{display:flex;align-items:center;gap:18px;padding:18px var(--pad);border-bottom:2.5px solid var(--ink);background:var(--yel);position:sticky;top:0;z-index:60}
.logo{font:800 32px var(--fd);letter-spacing:-.03em}.logo span{background:var(--ink);color:var(--yel);padding:0 8px;border-radius:8px;margin-left:2px}
nav.m{display:flex;gap:6px;margin-left:16px}nav.m a{padding:8px 16px;border:2.5px solid transparent;border-radius:99px;font:700 15px var(--fd)}nav.m a:hover{border-color:var(--ink);background:#fff}nav.m a.on{border-color:var(--ink);background:var(--ink);color:var(--yel)}
.sp{flex:1}.search{background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:9px 18px;min-width:240px;font:400 14px var(--fm);box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-align:left;color:var(--ink)}.av{min-width:42px;height:42px;padding:0 14px;display:grid;place-items:center;border-radius:99px;background:var(--pink);border:2.5px solid var(--ink);font:700 13px var(--fm)}
main.h{padding:36px var(--pad);max-width:1500px;margin:0 auto}
.bento{display:grid;grid-template-columns:2.1fr 1fr;gap:22px}
.hero{position:relative;min-height:470px;overflow:hidden;display:flex;align-items:flex-end}.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%}.hero .sh{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,20,.92),transparent 62%)}
.hero .in{position:relative;padding:34px;color:#fff}.tag{display:inline-block;background:var(--lime);color:var(--ink);font:700 12px var(--fm);border:2px solid var(--ink);border-radius:8px;padding:4px 10px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.hero h1{font:800 clamp(46px,6vw,88px)/.92 var(--fd);letter-spacing:-.03em;margin:14px 0 10px}.hero p{max-width:520px;color:#ece7da}.hero .row2{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.side{display:grid;gap:22px}.mini{padding:22px}.mini h3{font:800 26px/1.05 var(--fd)}.mini p{font-size:14px;margin:8px 0 14px}.mini.c1{background:var(--sky)}.mini.c2{background:var(--pink)}
.sec{margin-top:54px}.sh2{display:flex;align-items:center;gap:14px;margin-bottom:20px}.sh2 h2{font:800 clamp(28px,3.2vw,42px) var(--fd);letter-spacing:-.02em;background:var(--lime);padding:0 10px;border:2.5px solid var(--ink);border-radius:10px;transform:rotate(-.8deg)}.sh2 a{margin-left:auto;font:700 13px var(--fm);border-bottom:2.5px solid var(--ink)}
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.mood{padding:20px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.mood:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:8px 8px 0 var(--ink)}.mood b{font:800 22px/1.05 var(--fd)}.mood .em{font:700 12px var(--fm)}
.row{display:flex;gap:20px;overflow-x:auto;padding:4px 10px 22px 4px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.card{display:block;flex:0 0 auto;width:196px}.card .ph{aspect-ratio:2/3;background:#ddd center/cover;border-radius:14px;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:.15s;position:relative}.card:hover .ph{transform:translate(-3px,-3px) rotate(-1.2deg);box-shadow:8px 8px 0 var(--ink)}
.card .rt{position:absolute;right:-8px;top:-10px;background:var(--yel);border:2.5px solid var(--ink);border-radius:99px;font:700 12px var(--fm);padding:2px 9px;z-index:2;transform:rotate(6deg)}
.card .t{font:800 18px/1.15 var(--fd);margin-top:14px}.card .s{font:400 12px var(--fm);opacity:.7;margin-top:2px}
.wide .card{width:360px}.wide .ph{aspect-ratio:16/9}
.daily{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}.daily .a{padding:34px;background:var(--accent)}.daily .a h3{font:800 clamp(30px,3.4vw,46px)/1 var(--fd);margin:14px 0}.daily .b{padding:34px;background:var(--lime);display:grid;place-items:center;text-align:center}.daily .big{font:800 96px/1 var(--fd)}
footer{margin:80px 0 0;padding:24px var(--pad);border-top:2.5px solid var(--ink);display:flex;justify-content:space-between;font:400 13px var(--fm);flex-wrap:wrap;gap:12px;background:var(--yel)}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--yel);border-top:2.5px solid var(--ink);justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));font:700 12px var(--fm)}.mnav a.on{background:var(--ink);color:var(--yel);padding:2px 10px;border-radius:99px}
@media(max-width:900px){:root{--pad:16px}header{padding:12px 16px}nav.m,.search{display:none}main.h{padding:18px 16px}.bento{grid-template-columns:1fr}.hero{min-height:420px}.moods{grid-template-columns:repeat(2,1fr)}.daily{grid-template-columns:1fr}.card{width:150px}.wide .card{width:280px}.mnav{display:flex}body{padding-bottom:64px}}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← all designs</a>
<script src="data.js"></script><script src="app.js"></script>
<script>
const {films,moods,top10,indian,acclaimed,hero,esc}=WV;
const card=(f,o={})=>`<a class="card" href="#film-${f.id}"><div class="ph" style="background-image:url(${o.wide?f.back():f.poster()})"><span class="rt">★ ${f.rating}</span></div><div class="t">${esc(f.title)}</div><div class="s">${f.year} · ${esc(f.genre.split(' · ')[0])}</div></a>`;
const cs=['var(--pink)','var(--sky)','var(--yel)','var(--lime)','var(--accent)','#d9c2ff'],em=['☔','🌀','😂','🫖','⚡','💎'];
const shell=(inner,r)=>`<header><a class="logo" href="#home">Watch<span>Vibe</span></a><nav class="m"><a class="${r==='home'?'on':''}" href="#home">Home</a><a class="${r==='films'?'on':''}" href="#films">Films</a><a class="${r==='games'?'on':''}" href="#games">Games</a><a class="${r==='watchlist'?'on':''}" href="#watchlist">Watchlist</a></nav><span class="sp"></span><button type="button" class="search" data-search>search anything…</button><a class="av" href="#watchlist">${WVApp.wlCount()} saved</a></header>${inner}<footer><span class="logo" style="font-size:20px">WatchVibe</span><span>privacy · terms · film data from TMDB</span></footer><nav class="mnav"><a class="${r==='home'?'on':''}" href="#home">home</a><a class="${r==='films'?'on':''}" href="#films">films</a><a class="${r==='games'?'on':''}" href="#games">games</a><a class="${r==='watchlist'?'on':''}" href="#watchlist">saved</a></nav>`;
const home=()=>`<main class="h"><div class="bento"><div class="bx hero"><div class="bg" style="background-image:url(${hero.back()})"></div><div class="sh"></div><div class="in"><span class="tag">NEW · ★ ${hero.rating}</span><h1>${esc(hero.title)}</h1><p>${esc(hero.plot)}</p><div class="row2"><button type="button" class="btn solid" data-trailer="${hero.id}">▶ Play trailer</button><button type="button" class="btn" data-add="${hero.id}">+ Watchlist</button></div></div></div>
<div class="side"><div class="bx mini c1"><h3>What are you feeling tonight?</h3><p>Pick a mood and get a whole page of films that match it.</p><a class="btn" href="#mood-cry">Pick a mood →</a></div><div class="bx mini c2"><span class="tag">DAILY #21</span><h3 style="margin-top:12px">Guess the film from one frame</h3><p>5 questions. Same for everyone.</p><a class="btn solid" href="#games">Play →</a></div></div></div>
<div class="sec"><div class="sh2"><h2>Pick your vibe</h2></div><div class="moods">${moods.map((m,i)=>`<a class="bx mood" href="#mood-${m.id}" style="background:${cs[i]}"><span class="em">${em[i]} 0${i+1}</span><b>${esc(m.label)}</b></a>`).join('')}</div></div>
<div class="sec"><div class="sh2"><h2>Top 10 right now</h2><a href="#films">see all →</a></div><div class="row">${top10.map((f,i)=>`<div style="position:relative;flex:0 0 auto;width:240px;padding-left:34px"><span style="position:absolute;left:-4px;bottom:52px;font:800 110px/1 'Cabinet Grotesk';color:#ff6b2c;-webkit-text-stroke:3px #141414;z-index:3;pointer-events:none">${i+1}</span>${card(f).replace('class="card"','class="card" style="width:200px"')}</div>`).join('')}</div></div>
<div class="sec"><div class="sh2"><h2>Indian cinema</h2><a href="#films">see all →</a></div><div class="row">${indian.map(f=>card(f)).join('')}</div></div>
<div class="sec wide"><div class="sh2"><h2>Critically acclaimed</h2><a href="#films">see all →</a></div><div class="row">${acclaimed.map(f=>card(f,{wide:true})).join('')}</div></div>
<div class="sec daily"><div class="bx a"><span class="tag" style="background:#fff">DAILY CHALLENGE</span><h3>Five questions. One blurry frame each. Zero spoilers.</h3><a class="btn" href="#games">Start today's round</a></div><div class="bx b"><div><div style="font:700 13px 'Space Mono'">YOUR STREAK</div><div class="big">7</div><div style="font:700 13px 'Space Mono'">DAYS IN A ROW</div></div></div></div></main>`;
WVApp.mount({name:'WatchVibe · Paper Pop',shell,home,card});
</script>
