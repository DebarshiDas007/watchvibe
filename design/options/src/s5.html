<title>WatchVibe · Command Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>try{var q=(location.search.match(/theme=(light|dark)/)||[])[1];var t=q||localStorage.getItem('wvd_theme');document.documentElement.dataset.theme=t||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
/*FONTS*/
/*BASE*/
/*PAGES*/
body{font-family:var(--fm)}.term{max-width:1180px;margin:0 auto;padding:46px var(--pad) 20px}
.hd1{font:600 clamp(40px,6vw,88px)/.9 var(--fb);letter-spacing:-.06em;margin-bottom:12px}.hd1 em{font-style:normal;color:var(--accent)}.sub{color:var(--mute);margin-bottom:30px;font-family:var(--fb);font-size:17px;max-width:620px}
.cmd{border:1px solid var(--ink);background:var(--surface)}.cmd .bar{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.cmd .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}.cmd .bar .sp{flex:1}
.prompt{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.prompt b{color:var(--accent);font-size:22px}.prompt input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:500 clamp(18px,2.4vw,26px) var(--fm);min-width:0}.prompt input::placeholder{color:var(--mute)}.caret{width:10px;height:22px;background:var(--accent);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.res{max-height:460px;overflow:auto}.res h4{font:500 11px var(--fm);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding:12px 18px 6px}
.rowx{display:grid;grid-template-columns:34px 1fr auto 70px;gap:14px;align-items:center;padding:9px 18px;border-top:1px solid transparent;cursor:pointer}.rowx:hover,.rowx:focus-visible{background:var(--accent);color:var(--accent-ink);outline:0}.rowx:hover .m2,.rowx:focus-visible .m2{color:inherit}.rowx b{font:500 16px var(--fm)}.rowx .m2{color:var(--mute);font-size:12px;text-transform:uppercase}.rowx .k{text-align:right;font-size:12px}.rowx .im{width:26px;height:38px;background:var(--line) center/cover}
.foot2{display:flex;gap:22px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);color:var(--mute);font-size:11px;text-transform:uppercase}.foot2 span b{color:var(--ink);font-weight:500}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;border:1px solid var(--ink)}.stat div{padding:18px;border-right:1px solid var(--line);background:var(--surface)}.stat div:last-child{border-right:0}.stat b{display:block;font:600 40px/1 var(--fb);letter-spacing:-.05em}.stat span{color:var(--mute);font-size:11px;text-transform:uppercase}
.tbl{margin-top:40px}.tbl h2{font:600 26px var(--fb);letter-spacing:-.04em;margin-bottom:12px}.tbl .rowx{grid-template-columns:34px 40px 1fr 140px 60px 70px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
@media(max-width:900px){.stat{grid-template-columns:1fr 1fr}.stat div:nth-child(2){border-right:0}.stat div:nth-child(-n+2){border-bottom:1px solid var(--line)}.rowx{grid-template-columns:30px 1fr 60px}.rowx .m2.hm{display:none}.tbl .rowx{grid-template-columns:30px 34px 1fr 56px}.tbl .rowx .hm{display:none}}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← All variations</a>
<script src="data.js"></script><script src="app.js"></script><script src="swiss-ui.js"></script>
<script>
const {films,moods,top10,hero,esc}=WV;
const results=q=>{q=(q||'').trim().toLowerCase();const ms=moods.filter(m=>!q||(m.label+' '+m.blurb).toLowerCase().includes(q));const fs=(q?films.filter(f=>(f.title+' '+f.genre+' '+f.year).toLowerCase().includes(q)):top10).slice(0,8);
return `${ms.length?`<h4>Moods ${ms.length}</h4>`+ms.map((m,i)=>`<a class="rowx" tabindex="0" data-kbrow href="#mood-${m.id}"><span class="m2">0${i+1}</span><b>${esc(m.label)}</b><span class="m2 hm">${esc(m.blurb.slice(0,40))}</span><span class="k">↵ open</span></a>`).join(''):''}
${fs.length?`<h4>${q?'Films '+fs.length:'Top ten right now'}</h4>`+fs.map(f=>`<a class="rowx" tabindex="0" data-kbrow href="#film-${f.id}" data-prev="${f.poster()}"><div class="im" style="background-image:url(${f.poster()})"></div><b>${esc(f.title)}</b><span class="m2 hm">${esc(f.genre.split(' · ')[0])} · ${f.year}</span><span class="k">★ ${f.rating}</span></a>`).join(''):''}${!ms.length&&!fs.length?'<h4>No match</h4><div class="rowx" style="cursor:default"><span></span><b>Nothing found. Try "comedy" or "2019".</b></div>':''}`;};
const home=()=>`<div class="term"><div class="mo" style="color:var(--accent);margin-bottom:16px">watchvibe — v21 — ready</div><h1 class="hd1">What do you feel like <em>watching?</em></h1><p class="sub">Type a mood, a genre, a year or a title. Press the down arrow to move through results and Enter to open one.</p>
<div class="cmd"><div class="bar"><i></i><i></i><i></i><span>search — ${films.length} films, ${moods.length} moods</span><span class="sp"></span><span class="kbd">esc</span></div><div class="prompt"><b>&gt;</b><input id="cmdq" type="text" placeholder="need a good cry" autocomplete="off" aria-label="Search" spellcheck="false"><span class="caret"></span></div><div class="res" id="cmdres">${results('')}</div><div class="foot2"><span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>j/k</b> move in lists</span><span><b>/</b> search anywhere</span></div></div>
<div class="stat"><div><b data-count="${films.length}">0</b><span>films</span></div><div><b data-count="${moods.length}">0</b><span>moods</span></div><div><b>${WVApp.wlCount()}</b><span>in watchlist</span></div><div><b data-count="7">0</b><span>day streak</span></div></div>
<div class="tbl"><h2>Cover film</h2><a class="rowx" href="#film-${hero.id}" data-prev="${hero.poster()}" style="border:1px solid var(--line)"><span class="m2">01</span><div class="im" style="background-image:url(${hero.poster()})"></div><b>${esc(hero.title)}</b><span class="m2 hm">${esc(hero.genre)}</span><span class="k">★ ${hero.rating}</span><span class="k">↵</span></a></div>
<div class="ctas"><a class="btn solid" href="#games">Play the daily game →</a><a class="btn" href="#films">Browse all films</a><button type="button" class="btn" data-trailer="${hero.id}">▶ Trailer</button></div></div>`;
document.addEventListener('input',e=>{if(e.target.id==='cmdq')document.getElementById('cmdres').innerHTML=results(e.target.value)});
document.addEventListener('keydown',e=>{const i=document.getElementById('cmdq');if(!i||document.activeElement!==i)return;if(e.key==='ArrowDown'){e.preventDefault();const r=document.querySelector('#cmdres [data-kbrow]');if(r)r.focus()}else if(e.key==='Enter'){const r=document.querySelector('#cmdres [data-kbrow]');if(r)location.hash=r.getAttribute('href').slice(1)}});
WVHook=r=>{if(r.name==='home'){const i=document.getElementById('cmdq');if(i&&innerWidth>900)i.focus()}};
WVApp.mount({name:'WatchVibe · Command Line',shell:(i,r)=>SW.shell(i,r,{home:'Prompt'}),home,card:SW.card});
</script>
