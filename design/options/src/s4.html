<title>WatchVibe · Editorial Spread</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var q=(location.search.match(/theme=(light|dark)/)||[])[1];var t=q||localStorage.getItem('wvd_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/*FONTS*/
/*BASE*/
/*PAGES*/
.ed{display:grid;grid-template-columns:200px 1fr;gap:0 var(--pad);padding:0 var(--pad)}
.rail{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);padding:36px 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);margin-right:-1px}.rail a{display:flex;gap:10px;color:var(--mute);padding:6px 0;transition:.2s}.rail a b{font:500 11px var(--fm);color:var(--mute)}.rail a.on,.rail a:hover{color:var(--ink)}.rail a.on b{color:var(--accent)}.rail .sp{flex:1}
.mainc{min-width:0;padding-left:var(--pad)}
.kin{padding:70px 0 50px;border-bottom:1px solid var(--ink)}.kin h1{font:600 clamp(54px,9vw,150px)/.88 var(--fb);letter-spacing:-.07em}.kin h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom}.kin h1 .w i{display:inline-block;font-style:normal;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}.kin h1 em{font-style:normal;color:var(--accent)}@keyframes up{to{transform:none}}
.kin .lead{display:flex;gap:30px;justify-content:space-between;align-items:flex-end;margin-top:34px;flex-wrap:wrap}.kin .lead p{max-width:460px;color:var(--mute);font-size:18px}
.chap{padding:56px 0;border-bottom:1px solid var(--ink)}.chap .ch{display:flex;gap:16px;align-items:baseline;margin-bottom:26px}.chap .ch h2{font:600 clamp(28px,3.4vw,46px)/1 var(--fb);letter-spacing:-.05em}.chap .ch span{color:var(--accent)}
.big{position:relative}.big a{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:6px 0;border-top:1px solid var(--line);position:relative;overflow:hidden}.big a:last-child{border-bottom:1px solid var(--line)}
.big a b{font:600 clamp(40px,6.4vw,96px)/1.05 var(--fb);letter-spacing:-.06em;transition:.35s}.big a .d{max-width:300px;color:var(--mute);font-size:14px;text-align:right}.big a:hover b{color:var(--accent);transform:translateX(18px)}.big a .im{position:absolute;right:30px;top:50%;width:90px;aspect-ratio:2/3;background:var(--line) center/cover;transform:translateY(-50%) scale(.6) rotate(6deg);opacity:0;transition:.35s;pointer-events:none}.big a:hover .im{opacity:1;transform:translateY(-50%) scale(1) rotate(-3deg)}
.nums{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}.nums::-webkit-scrollbar{display:none}.nums a{flex:0 0 auto;position:relative;width:240px}.nums .n{font:600 190px/.8 var(--fb);letter-spacing:-.08em;color:transparent;-webkit-text-stroke:1.5px var(--ink);display:block;margin-bottom:-60px;position:relative;z-index:0}.nums .ph{aspect-ratio:2/3;background:var(--line) center/cover;position:relative;z-index:1;margin-left:70px;width:170px;transition:.3s}.nums a:hover .ph{transform:translateY(-8px);outline:2px solid var(--accent);outline-offset:3px}.nums a:hover .n{-webkit-text-stroke-color:var(--accent)}.nums .t{margin:10px 0 0 70px;font:600 15px var(--fb);letter-spacing:-.02em}
.quote{padding:70px 0;border-bottom:1px solid var(--ink)}.quote blockquote{font:600 clamp(32px,4.6vw,68px)/1.02 var(--fb);letter-spacing:-.055em;max-width:1000px}.quote cite{display:block;margin-top:22px;font:500 12px var(--fm);text-transform:uppercase;color:var(--mute);font-style:normal}
.huge{padding:60px 0 30px;font:700 clamp(80px,19vw,300px)/.8 var(--fb);letter-spacing:-.09em;overflow:hidden;white-space:nowrap}.huge i{font-style:normal;color:var(--accent)}
@media(max-width:900px){.ed{grid-template-columns:1fr;padding:0 var(--pad)}.rail{display:none}.mainc{padding-left:0}.kin{padding:40px 0 34px}.big a .d{display:none}.big a .im{display:none}.nums a{width:200px}.nums .n{font-size:150px;margin-bottom:-46px}.nums .ph{margin-left:50px;width:140px}.nums .t{margin-left:50px}}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← All variations</a>
<script src="data.js"></script><script src="app.js"></script><script src="swiss-ui.js"></script>
<script>
const {films,moods,top10,indian,acclaimed,hero,esc}=WV;
const words=(s,d)=>s.split(' ').map((w,i)=>`<span class="w"><i style="animation-delay:${d+i*.09}s">${w}</i></span>`).join(' ');
const rail=`<aside class="rail mo"><a class="on" href="#s-top"><b>00</b>Cover</a><a href="#s-moods"><b>01</b>Moods</a><a href="#s-top10"><b>02</b>The ten</a><a href="#s-india"><b>03</b>Regional</a><a href="#s-canon"><b>04</b>Canon</a><span class="sp"></span><a href="#games"><b>→</b>Daily game</a></aside>`;
const home=()=>`<div class="ed">${rail}<div class="mainc">
<div class="kin" id="s-top"><div class="mo" style="color:var(--accent);margin-bottom:22px">Issue no. 21 · films, by feeling</div><h1>${words('Find what to watch',0.1)} <em>${words('by feeling.',0.55)}</em></h1><div class="lead"><p>Six moods, thirty-six films, one rule: pick how you feel and we show only what fits. ${esc(hero.title)} is the cover story this week.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn solid" href="#film-${hero.id}">Read the cover story →</a><button type="button" class="btn" data-add="${hero.id}">+ Watchlist</button></div></div></div>
<div class="chap" id="s-moods"><div class="ch"><span class="mo">01</span><h2>Start with a feeling.</h2></div><div class="big">${moods.map(m=>{const t=films.filter(f=>f.moods.includes(m.id)).sort((a,b)=>b.rating-a.rating)[0];return `<a href="#mood-${m.id}"><b>${esc(m.label)}</b><span class="d">${esc(m.blurb)}</span><span class="im" style="background-image:url(${t.poster()})"></span></a>`}).join('')}</div></div>
<div class="chap" id="s-top10"><div class="ch"><span class="mo">02</span><h2>The ten, in order.</h2></div><div class="nums">${top10.map((f,i)=>`<a href="#film-${f.id}"><span class="n">${i+1}</span><div class="ph" style="background-image:url(${f.poster()})"></div><div class="t">${esc(f.title)}</div></a>`).join('')}</div></div>
<div class="quote"><blockquote>“A film is a feeling you can schedule.”</blockquote><cite>WatchVibe, issue 21</cite></div>
<div class="chap" id="s-india"><div class="ch"><span class="mo">03</span><h2>Indian cinema.</h2></div>${SW.stripOf(indian)}</div>
<div class="chap wide" id="s-canon"><div class="ch"><span class="mo">04</span><h2>The canon.</h2></div>${SW.stripOf(acclaimed,{wide:true})}</div>
<div class="huge">Watch<i>Vibe</i></div></div></div>`;
WVHook=r=>{if(r.name!=='home')return;const links=[...document.querySelectorAll('.rail a[href^="#s-"]')];const secs=links.map(a=>document.querySelector(a.getAttribute('href')));const on=()=>{let k=0;secs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<innerHeight*.4)k=i});links.forEach((a,i)=>a.classList.toggle('on',i===k))};window.addEventListener('scroll',on,{passive:true});on();};
document.addEventListener('click',e=>{const a=e.target.closest('.rail a[href^="#s-"]');if(!a)return;e.preventDefault();const s=document.querySelector(a.getAttribute('href'));if(s)window.scrollTo({top:s.getBoundingClientRect().top+scrollY-70,behavior:'smooth'});});
WVApp.mount({name:'WatchVibe · Editorial Spread',shell:(i,r)=>SW.shell(i,r,{home:'Cover'}),home,card:SW.card});
</script>
