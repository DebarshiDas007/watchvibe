<title>WatchVibe · Noir Cinema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
:root{--bg:#0b0a09;--surface:#141210;--ink:#ede6d6;--mute:#8c8577;--line:#2a2621;--accent:#c8a45c;--accent-ink:#0b0a09;--r:2px;--rc:2px;--rb:0;--fd:Gambetta,Georgia,serif;--fb:Satoshi,system-ui,sans-serif;--pad:56px;--hw:500;--hls:-.01em}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:300;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/*PAGES*/
a{color:inherit;text-decoration:none}.serif{font-family:var(--fd)}
.back-all{position:fixed;left:12px;bottom:12px;z-index:400;font:500 12px var(--fb);background:#000;color:#ede6d6;border:1px solid #444;padding:8px 14px;letter-spacing:.08em;text-transform:uppercase}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px var(--pad);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:60}
header nav{display:flex;gap:28px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}header nav a:hover,header nav a.on{color:var(--ink)}
.logo{font:500 30px var(--fd);letter-spacing:.02em;text-align:center}.logo i{color:var(--accent)}
.right{display:flex;justify-content:flex-end;gap:22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);align-items:center}.right a,.right button{color:inherit;background:none;border:0;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}.right a:hover,.right button:hover{color:var(--ink)}
.hero{position:relative;min-height:640px;display:flex;align-items:flex-end;padding:0 var(--pad) 64px;border-bottom:1px solid var(--line);overflow:hidden}
.hero .bg{position:absolute;inset:48px 0;background-size:cover;background-position:center 30%;filter:saturate(.7) contrast(1.05)}
.hero::before,.hero::after{content:"";position:absolute;left:0;right:0;height:48px;background:#000;z-index:2}.hero::before{top:0}.hero::after{bottom:0}
.hero .shade{position:absolute;inset:48px 0;background:linear-gradient(90deg,#0b0a09 5%,rgba(11,10,9,.55) 45%,rgba(11,10,9,.1)),linear-gradient(0deg,#0b0a09,transparent 50%)}
.hero .in{position:relative;z-index:3;max-width:720px;margin-bottom:8px}
.kick{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);display:flex;gap:14px;align-items:center}.kick::before{content:"";width:40px;height:1px;background:var(--accent)}
.hero h1{font:500 clamp(54px,8vw,120px)/.95 var(--fd);margin:18px 0 16px;letter-spacing:-.01em}.hero p{color:#cfc7b6;max-width:520px;font-size:17px}
.meta{margin:18px 0 28px;display:flex;gap:18px;color:var(--mute);font-size:14px}.meta b{color:var(--accent);font-weight:700}
.btn{font-size:13px;letter-spacing:.16em;text-transform:uppercase;border-radius:0}.btn.solid{background:var(--ink);color:#0b0a09;border-color:var(--ink)}.btn:hover{background:var(--accent);border-color:var(--accent);color:#0b0a09;transform:none}.hero .btn+.btn{margin-left:12px}
section.s{padding:72px var(--pad) 0}
.ch{display:flex;align-items:baseline;gap:20px;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:16px}
.ch .n{font:italic 400 18px var(--fd);color:var(--accent)}.ch h2{font:500 clamp(30px,3.4vw,46px) var(--fd);letter-spacing:-.01em}.ch a{margin-left:auto;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.ch a:hover{color:var(--ink)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.mood{padding:34px 28px 30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:.3s;position:relative;display:block}
.mood:hover{background:var(--surface)}.mood .i{font:italic 14px var(--fd);color:var(--accent)}.mood h3{font:500 28px/1.1 var(--fd);margin:8px 0 10px}.mood p{color:var(--mute);font-size:14px}
.mood .ar{position:absolute;right:26px;top:30px;opacity:0;transform:translateX(-8px);transition:.3s;color:var(--accent)}.mood:hover .ar{opacity:1;transform:none}
.row{display:flex;gap:20px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.card{display:block;flex:0 0 auto;width:200px;transition:.35s}.card .ph{aspect-ratio:2/3;background:#1a1714 center/cover;filter:grayscale(.35) contrast(1.05);transition:.4s;outline:1px solid var(--line)}
.card:hover .ph{filter:none;transform:translateY(-6px)}.card .t{font:500 18px/1.2 var(--fd);margin-top:12px}.card .s{font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}.card .s b{color:var(--accent)}
.wide .card{width:380px}.wide .ph{aspect-ratio:16/9}
.feature{display:grid;grid-template-columns:1.2fr 1fr;border:1px solid var(--line)}
.feature .l{padding:56px}.feature .l h3{font:500 44px/1.05 var(--fd);margin:14px 0 14px}.feature .l p{color:var(--mute);max-width:440px;margin-bottom:28px}
.feature .r{background:var(--surface);display:grid;place-items:center;padding:30px;border-left:1px solid var(--line)}.pill{display:flex;gap:8px;margin-bottom:18px;justify-content:center}.pill i{width:40px;height:4px;background:var(--line)}.pill i.on{background:var(--accent)}
footer{margin-top:96px;padding:56px var(--pad);border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mute);font-size:13px;gap:24px;flex-wrap:wrap}footer .logo{text-align:left;font-size:26px;color:var(--ink)}
@media(max-width:820px){:root{--pad:20px}header{padding:14px 20px;grid-template-columns:auto 1fr}header nav{display:none}.logo{text-align:left;font-size:24px}.hero{min-height:560px}section.s{padding:48px var(--pad) 0}.moods{grid-template-columns:1fr}.feature{grid-template-columns:1fr}.feature .l{padding:30px 22px}.card{width:150px}.wide .card{width:280px}.right .hide-m{display:none}}
@media(max-width:820px){.mnav{display:flex!important}}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.mnav a.on{color:var(--accent)}
</style>
<div id="app"></div>
<a class="back-all" href="index.html">← All designs</a>
<script src="data.js"></script><script src="app.js"></script>
<script>
const {films,by,moods,top10,indian,acclaimed,hero,esc}=WV;
const card=(f,o={})=>`<a class="card" href="#film-${f.id}"><div class="ph" style="background-image:url(${o.wide?f.back():f.poster()})"></div><div class="t">${esc(f.title)}</div><div class="s"><b>★ ${f.rating}</b> &nbsp;${f.year} · ${esc(f.genre.split(' · ')[0])}</div></a>`;
const roman=['i','ii','iii','iv','v','vi'];
const shell=(inner,r)=>`<header><nav><a class="${r==='home'?'on':''}" href="#home">Home</a><a class="${r==='films'?'on':''}" href="#films">Films</a><a class="${r==='games'?'on':''}" href="#games">Games</a></nav><a class="logo" href="#home">Watch<i>Vibe</i></a><div class="right"><button type="button" data-search>Search</button><a class="${r==='watchlist'?'on':''}" href="#watchlist">Watchlist${WVApp.wlCount()?' ('+WVApp.wlCount()+')':''}</a></div></header>${inner}<footer><div><div class="logo">Watch<i>Vibe</i></div><div style="margin-top:10px;max-width:340px">Find what to watch by feeling. Film data from TMDB.</div></div><div>Privacy · Terms · Contact</div></footer><nav class="mnav"><a class="${r==='home'?'on':''}" href="#home">Home</a><a class="${r==='films'?'on':''}" href="#films">Films</a><a class="${r==='games'?'on':''}" href="#games">Games</a><a class="${r==='watchlist'?'on':''}" href="#watchlist">Saved</a></nav>`;
const home=()=>`<div class="hero"><div class="bg" style="background-image:url(${hero.back()})"></div><div class="shade"></div><div class="in"><div class="kick">Featured · ${esc(hero.genre)}</div><h1>${esc(hero.title)}</h1><p>${esc(hero.plot)}</p><div class="meta"><span><b>★ ${hero.rating}</b></span><span>${hero.year}</span><span>2h 36m</span></div><button type="button" class="btn solid" data-trailer="${hero.id}">▶ Play trailer</button><button type="button" class="btn" data-add="${hero.id}">+ Watchlist</button></div></div>
<section class="s"><div class="ch"><span class="n">I.</span><h2>What are you in the mood for?</h2></div><div class="moods">${moods.map((m,i)=>`<a class="mood" href="#mood-${m.id}"><span class="i">${roman[i]}.</span><span class="ar">→</span><h3>${esc(m.label)}</h3><p>${esc(m.blurb)}</p></a>`).join('')}</div></section>
<section class="s"><div class="ch"><span class="n">II.</span><h2>The ten everyone is watching</h2><a href="#films">See all →</a></div><div class="row">${top10.map((f,i)=>`<div style="position:relative;flex:0 0 auto;width:250px;padding-left:46px"><span style="position:absolute;left:0;bottom:46px;font:italic 400 120px/1 Gambetta,serif;color:transparent;-webkit-text-stroke:1px #c8a45c;transform:translateX(-4px)">${i+1}</span>${card(f).replace('class="card"','class="card" style="width:200px"')}</div>`).join('')}</div></section>
<section class="s"><div class="ch"><span class="n">III.</span><h2>Indian cinema, best loved first</h2><a href="#films">See all →</a></div><div class="row">${indian.map(f=>card(f)).join('')}</div></section>
<section class="s wide"><div class="ch"><span class="n">IV.</span><h2>Acclaimed, and worth your evening</h2><a href="#films">See all →</a></div><div class="row">${acclaimed.map(f=>card(f,{wide:true})).join('')}</div></section>
<section class="s"><div class="feature"><div class="l"><div class="kick">Daily challenge no. 21</div><h3>Guess the film from a single frame.</h3><p>Five questions, the same for everyone. Share your result with friends.</p><a class="btn solid" href="#games">Play today's round</a></div><div class="r"><div style="text-align:center"><div class="pill"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><div class="serif" style="font-size:96px;line-height:1;color:var(--accent)">12<span style="font-size:36px;color:var(--mute)">/20</span></div><div style="color:var(--mute);margin-top:8px;font-size:13px;letter-spacing:.16em;text-transform:uppercase">Your best this week</div></div></div></div></section>`;
WVApp.mount({name:'WatchVibe · Noir Cinema',shell,home,card});
</script>
